<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Portail Diane — Keven</title>
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <canvas id="starry-canvas"></canvas>
  <main class="chat-shell">
    <header class="chat-head">
      <div id="agent-avatar" class="agent-avatar"></div>
      <div class="agent-info"><h1>Keven</h1><p>Personnage NyXia</p></div>
      <div class="head-actions">
        <button id="formation-btn" type="button" hidden>🎓 Formation Vivante</button>
        <button id="new-chat-btn" type="button">✨ Nouveau chat</button>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>
    <div id="attachment-state" class="attachment-state" hidden></div>

    <footer class="composer">
      <label class="icon-btn" title="Joindre une image">📎<input id="file-input" type="file" accept="image/*" hidden></label>
      <button class="icon-btn" id="mic-btn" type="button" title="Parler">🎤</button>
      <textarea id="message-input" rows="1" placeholder="Écris ou parle à Keven…"></textarea>
      <button class="send-btn" id="send-btn" type="button" title="Envoyer">➤</button>
    </footer>
  </main>

  <script>
    window.NYXIA_AGENT = {"key":"keven","name":"Keven","sub":"Personnage NyXia","icon":"✨","image":"https://d1yei2z3i6k35z.cloudfront.net/1872133/6ab5be53c03371.71325328_Keven.png","custom":true,"portail":"","voiceEnv":"ELEVENLABS_KEVEN_VOICE_ID","voiceId":"RTFg9niKcgGLDwa3RFlz","greeting":"Je suis là. Dis-moi ce que tu veux faire avancer dans ce portail."};
    window.NYXIA_PORTAL_TITLE = "Portail Diane";
  </script>
  <script src="/js/starry-bg.js" defer></script>
  <script src="/js/chat.js" defer></script>
</body>
</html>
